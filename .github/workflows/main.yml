name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update || true
        sudo apt-get install -y libssl-dev pkg-config make git cmake wget tar clang llvm

    - name: Construir e Instalar OpenOrbis Toolchain
      run: |
        # Clonamos el repositorio oficial del Toolchain
        git clone --recursive https://github.com /opt/openorbis
        
        # Seteamos las variables de entorno necesarias para la compilación del SDK
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH
        
        # Compilamos las herramientas de empaquetado nativas (create-eboot, create-pkg)
        cd /opt/openorbis
        make

    - name: Configurar Proyecto con CMake
      run: |
        # Forzamos a CMake a usar el archivo de configuración de PS4 de OpenOrbis
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake

    - name: Compilar Codigo Fuente
      run: |
        # Compilamos el puerto de Mario Maker 2
        cmake --build build --config Release

    - name: Construir archivo pkg
      run: |
        echo "Aca va el empaquetado final una vez que compile el binario sin errores"
        
