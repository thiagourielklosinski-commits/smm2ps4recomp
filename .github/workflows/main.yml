name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cambiar repositorios a los oficiales globales
      run: |
        # Reemplazamos los servidores espejos de Azure (que están rotos) por los oficiales de Ubuntu
        sudo sed -i 's|http://ubuntu.com|http://ubuntu.com|g' /etc/apt/sources.list || true

    - name: Instalar dependencias del sistema
      run: |
        # Forzamos un límite de reintentos rápidos para que no se quede colgado esperando
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get install -y --fix-missing libssl-dev pkg-config make git cmake wget tar clang llvm

    - name: Construir e Instalar OpenOrbis Toolchain
      run: |
        git clone --recursive https://github.com /opt/openorbis
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH
        cd /opt/openorbis
        make

    - name: Configurar Proyecto con CMake
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release

    - name: Construir archivo pkg
      run: |
        echo "Aca va el empaquetado final una vez que compile el binario sin errores"
        
