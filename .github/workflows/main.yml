
name: SMM2 PS4 Experimental Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            pkg-config \
            python3 \
            git \
            curl \
            zip \
            unzip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check package icon
        run: |
          test -f Pkgicon.png
          file Pkgicon.png

      - name: Check Rust
        working-directory: core
        run: cargo check --workspace --locked

      - name: Build Rust
        working-directory: core
        run: cargo build --workspace --release --locked

      - name: Inspect PS4 build support
        working-directory: recomp
        run: |
          echo "Checking available platforms..."

          if grep -qiE 'ps4|orbis' Makefile; then
            echo "PS4 references found:"
            grep -inE 'ps4|orbis' Makefile
          else
            echo "::warning::No PS4/Orbis target found in Makefile"
            echo "PS4 compilation is not implemented yet."
          fi

      - name: Check PS4 packaging tools
        run: |
          for tool in orbis-clang orbis-ld create-fself; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool found"
            else
              echo "$tool not installed"
            fi
          done

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: SMM2-PS4-build-diagnostics
          path: |
            Pkgicon.png
            recomp/Makefile
          if-no-files-found: error
          
