name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: false # Desactivamos submodulos conflictivos temporalmente

    - name: Descargar OpenOrbis mediante ZIP Seguro
      run: |
        # Usamos la API de GitHub directo en formato ZIP para saltear fallos de Git/DNS
        wget https://github.com -O openorbis.zip
        unzip openorbis.zip
        sudo mv OpenOrbis-PS4-Toolchain-master /opt/openorbis
        
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH

    - name: Configurar Proyecto con CMake
      run: |
        # Saltamos la busqueda de librerias de PC que congelan el proceso
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake -DENABLE_SDL3=OFF -DENABLE_VULKAN=OFF

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release
        
