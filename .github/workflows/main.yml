name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config make git cmake wget tar

    - name: Descargar e instalar OpenOrbis Toolchain completo
      run: |
        # Creamos el directorio destino
        sudo mkdir -p /opt/openorbis
        # Descargamos los binarios oficiales compilados para Linux
        wget https://github.com
        # Extraemos directamente en la ruta del SDK
        sudo tar -xzvf OpenOrbisPS4Toolchain-Linux.tar.gz -C /opt/openorbis --strip-components=1
        
        # Seteamos las variables de entorno requeridas por OpenOrbis en el contenedor
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH

    - name: Configurar Proyecto con CMake
      run: |
        # Ejecutamos CMake apuntando al archivo toolchain oficial de OpenOrbis
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake

    - name: Compilar Codigo Fuente
      run: |
        # Compilamos el proyecto
        cmake --build build --config Release

    - name: Construir archivo pkg
      run: |
        echo "Aca va el empaquetado final una vez que compile el binario sin errores"
        
