
name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Clonar OpenOrbis de forma nativa
      run: |
        P1="https://github.com"
        P2="/OpenOrbis"
        P3="/OpenOrbis-PS4-Toolchain.git"
        
        git clone --depth=1 "$P1$P2$P3" /opt/openorbis
        
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH

    - name: Configurar Proyecto con CMake
      run: |
        # Apuntamos la compilación directamente al directorio nativo del subproyecto recomp
        cmake -S recomp -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake -DENABLE_SDL3=OFF -DENABLE_VULKAN=OFF

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release
        
