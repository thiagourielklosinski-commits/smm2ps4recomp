name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Clonar OpenOrbis de forma nativa
      run: |
        # Usamos un clonado simple sin submódulos pesados para evitar errores de conexión
        git clone --depth=1 https://github.com /opt/openorbis
        
        # Configuramos las variables de entorno requeridas por el SDK
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH

    - name: Configurar Proyecto con CMake
      run: |
        # Pasamos las flags para ignorar los componentes de escritorio (PC)
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake -DENABLE_SDL3=OFF -DENABLE_VULKAN=OFF

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release
        
