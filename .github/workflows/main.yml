
name: SMM2 PS4 Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            pkg-config \
            python3 \
            git \
            curl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check ICON0.PNG
        run: |
          if [ ! -f "ICON0.PNG" ]; then
            echo "ERROR: No se encontro ICON0.PNG en la raiz"
            exit 1
          fi
          echo "ICON0.PNG encontrado correctamente"
          file "ICON0.PNG"

      - name: Check Rust
        working-directory: core
        run: cargo check --workspace --locked

      - name: Build Rust
        working-directory: core
        run: cargo build --workspace --release --locked
        
