name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: true # Activamos submodulos por si hay dependencias internas de Rust

    - name: Clonar OpenOrbis de forma nativa
      run: |
        P1="https://github.com"
        P2="/OpenOrbis"
        P3="/OpenOrbis-PS4-Toolchain.git"
        
        git clone --depth=1 "$P1$P2$P3" /opt/openorbis
        
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH

    - name: Configurar e Instalar Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Compilar Proyecto con Cargo
      run: |
        # Compilamos usando el gestor nativo del proyecto en modo Release
        cargo build --release
        
