name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    # Forzamos una versión estable de Ubuntu para evitar los servidores caídos de la versión experimental
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar DNS y limpiar espejos de red
      run: |
        # Forzar DNS de Google para evitar fallos de resolución de nombres (Temporary failure)
        sudo echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        sudo echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config make git cmake wget tar clang llvm

    - name: Construir e Instalar OpenOrbis Toolchain
      run: |
        git clone --recursive https://github.com /opt/openorbis
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
        echo "/opt/openorbis/extra/llvm/bin" >> $GITHUB_PATH
        cd /opt/openorbis
        make

    - name: Configurar Proyecto con CMake
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release

    - name: Construir archivo pkg
      run: |
        echo "Aca va el empaquetado final una vez que compile el binario sin errores"
        
