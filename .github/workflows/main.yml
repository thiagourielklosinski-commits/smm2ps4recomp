name: Compilar SMM2 para PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config make git cmake wget

    - name: Descargar e instalar OpenOrbis Toolchain
      run: |
        P1="https://github.com"
        P2="/OpenOrbis"
        P3="/OpenOrbis-PS4-Toolchain.git"
        git clone "$P1$P2$P3" /opt/openorbis
        echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV

    - name: Configurar Entorno
      run: |
        echo "SDK de PS4 configurado en: $OO_PS4_TOOLCHAIN"

    - name: Configurar Proyecto con CMake
      run: |
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=/opt/openorbis/cmake/ps4.cmake

    - name: Compilar Codigo Fuente
      run: |
        cmake --build build --config Release

    - name: Construir archivo pkg
      run: |
        echo "Aca va el empaquetado final una vez que compile el binario"
        
